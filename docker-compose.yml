version: '3.8'

services:
  # 1. Relational Database Tier: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: camps_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: camps_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Machine Learning Tier: Python Flask + XGBoost + TreeSHAP
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: camps_ml_service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - MODEL_VERSION=v1.0.0
    volumes:
      - ./ml-service/saved_models:/app/saved_models

  # 3. Application API Tier: Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camps_backend_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=camps_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - ML_SERVICE_URL=http://ml-service:5001
      - JWT_SECRET=camps_vtu_pesitm_super_secret_jwt_key_2024_shivamogga
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started

  # 4. Presentation Web Tier: React 18 + Vite (Tailwind CSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: camps_frontend_web
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mysql_data:
