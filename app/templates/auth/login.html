{% extends "base.html" %}

{% block title %}Sign In - CAMPS-ML{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="display-6 text-primary mb-2">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>
                    <h3 class="fw-bold">CAMPS-ML Portal</h3>
                    <p class="text-muted small">Centralized Academic Monitoring & Prediction System</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address, USN, or Student Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="email" name="email" placeholder="e.g. Poorvi V S, 1RV21CD000, or admin@camps.edu" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                        <div class="form-text text-muted" style="font-size: 0.75rem;">Default student password is <code>Student@123</code></div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label small text-muted" for="remember">Remember this workstation</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                    </button>
                </form>

                <!-- Demo One-Click Fill for Viva Defense -->
                <div class="mt-4 pt-3 border-top text-center">
                    <div class="small fw-bold text-muted mb-2">1-Click Demo Accounts:</div>
                    <div class="d-flex flex-wrap gap-1 justify-content-center">
                        <button type="button" class="btn btn-sm btn-primary" onclick="fillDemo('Poorvi V S', 'Student@123')">Poorvi V S (Student)</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillDemo('admin@camps.edu', 'Admin@123')">Admin</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillDemo('hod.csd@camps.edu', 'Hod@123')">HoD</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillDemo('prof.anita@camps.edu', 'Faculty@123')">Faculty</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillDemo('student.1rv21cd001@camps.edu', 'Student@123')">High Risk Student</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
